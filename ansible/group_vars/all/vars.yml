---
# Values from the post. Secrets live in vault.yml (see vault.yml.example).
qdrant_api_key: "{{ vault_qdrant_api_key }}"

# Qdrant publishes no ports; Traefik routes this host name to it and terminates TLS.
qdrant_hostname: qdrant.example.com

# How Claude Code reaches Qdrant: through Traefik, as in the post.
mcp_client_qdrant_url: "https://{{ qdrant_hostname }}:443"
mcp_client_collection_name: architectural-decisions
mcp_client_embedding_model: sentence-transformers/all-MiniLM-L6-v2
