---
qdrant_dir: /opt/qdrant
# A pinned release, as in the post. Check https://github.com/qdrant/qdrant/releases to upgrade.
qdrant_image: qdrant/qdrant:v1.20.2
qdrant_container_name: qdrant
qdrant_api_key: ""

# Qdrant publishes no ports. Traefik (set up as in the post "Configuring Traefik with
# Let's Encrypt on Docker") reaches it on this Docker network and terminates TLS.
qdrant_traefik_network: traefik-network
qdrant_hostname: qdrant.example.com
qdrant_traefik_entrypoint: websecure
qdrant_traefik_certresolver: transip
