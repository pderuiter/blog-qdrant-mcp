---
- name: Check that an API key is set
  ansible.builtin.assert:
    that:
      - qdrant_api_key | length > 0
    fail_msg: Set qdrant_api_key (vault_qdrant_api_key in vault.yml).
    quiet: true

- name: Create the project directory
  ansible.builtin.file:
    path: "{{ qdrant_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ qdrant_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Start Qdrant
  community.docker.docker_compose_v2:
    project_src: "{{ qdrant_dir }}"
    state: present

- name: Wait for the health check
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ qdrant_http_port }}/healthz"
    return_content: true
  register: qdrant_healthz
  retries: 20
  delay: 3
  until: qdrant_healthz.status == 200 and 'healthz check passed' in qdrant_healthz.content

- name: Check that the API key is enforced
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ qdrant_http_port }}/collections"
    status_code: 401
